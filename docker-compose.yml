services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: limpygo-backend:latest
        container_name: limpygo_backend
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:8000'
        working_dir: /var/www/html
        environment:
            WWWUSER: '1000'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}/backend'
        volumes:
            - './backend:/var/www/html'
        networks:
            - limpygo-net
        depends_on:
            mysql:
                condition: service_healthy
        command: php artisan serve --host=0.0.0.0 --port=8000

    mysql:
        image: 'mariadb:10.11'
        container_name: limpygo_mysql
        ports:
            - '${FORWARD_DB_PORT:-3309}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
            MYSQL_DATABASE: '${DB_DATABASE:-cleango_db}'
            MYSQL_USER: '${DB_USERNAME:-}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-}'
        volumes:
            - 'limpygo-mysql:/var/lib/mysql'
        networks:
            - limpygo-net
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            timeout: 20s
            retries: 10

networks:
    limpygo-net:
        driver: bridge

volumes:
    limpygo-mysql:
        driver: local
